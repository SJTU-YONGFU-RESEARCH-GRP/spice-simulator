name: Deploy GitHub Pages

# The public site is the Analog Canvas / SPICE schematic editor build
# (Vite dist from analog-canvas-js), NOT the legacy vanilla MNA simulator.
# Publish with: scripts/publish-editor-pages.sh (or npm run publish:editor)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ hashFiles('site/index.html') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish site/ to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
