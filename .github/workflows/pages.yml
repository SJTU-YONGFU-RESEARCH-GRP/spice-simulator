name: Deploy GitHub Pages

# Deploys the Vite schematic editor build from ./site (not the legacy MNA UI).
# Refresh ./site with: ./scripts/publish-editor-pages.sh

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "site/**"
      - "scripts/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify editor site bundle
        run: test -f site/index.html && test -d site/assets
      # site/ is a checked-in build artifact, so this workflow is the last place
      # that can catch a dead reference before users hit it. The guard resolves
      # every root-absolute literal the artifact emits against the deployed
      # base, and rejects a development JSX runtime in a production bundle.
      # The same check runs locally as: node scripts/check-artifacts.mjs
      #
      # Deviations that are known and attributable live in
      # scripts/known-deviations.json. They are printed with their reason, never
      # silently skipped, and an entry that stops matching is reported as a
      # finding -- so the list cannot outlive what it describes.
      - name: Guard published artifact references
        run: node scripts/check-artifacts.mjs --accept=scripts/known-deviations.json
      # Static guard + browser smoke prove the bundle loads and runs; neither
      # checks whether the NUMBERS are correct. This step drives the shipped
      # WASM in a Node host and compares every result against first-principles
      # closed forms, so a rebuild that silently changes a device model fails
      # here, before it can be published.
      - name: Cross-check numeric results against first principles
        run: node scripts/numeric-crosscheck.mjs
      # A guard that only ever prints PASS proves nothing. This step mutates the
      # guard itself (a wrong closed-form expectation, a wrong invariant limit)
      # and the deck (a changed diode ideality factor, i.e. a silently changed
      # device model) and requires every mutant to go red. It is the automated
      # form of the project rule "a new check must be shown to fail when the
      # thing it guards breaks".
      - name: Prove the numeric guard is not vacuous (mutation test)
        run: node scripts/numeric-crosscheck.negctl.mjs
      # The guard above classifies every outbound target the artifact can reach
      # (scripts/outbound-manifest.json). That is a statement about text: a
      # repair that is present but inert -- a comparison that never runs -- would
      # satisfy it. This step lifts the loader and hash helper out of the shipped
      # chunk and runs them, and requires a tampered payload to be refused *and
      # never executed*.
      - name: Verify the ngspice fallback enforces its integrity pin
        run: node scripts/egress-integrity.mjs
      # And this one breaks the outbound surface four different ways (a
      # forbidden URL, an undeclared host, a lost repair, a drifted pin) plus
      # the runtime probe three ways, and requires every case to be caught --
      # with a control tree that must stay clean, so a check that always fails
      # cannot pass for a working one.
      - name: Prove the outbound checks are not vacuous (mutation test)
        run: node scripts/outbound-repair.negctl.mjs
      # The shell documents decide every origin the page may load from. Check 11
      # asserts the policy is present, that its inline-script hash still
      # re-derives from the committed bytes, and that no origin is named which
      # the outbound manifest has not classified. This step breaks each of those
      # claims in turn and requires the guard to notice.
      - name: Prove the shell-policy checks are not vacuous (mutation test)
        run: node scripts/csp-guard.negctl.mjs
      # The shell decides what may load; the worker decides what survives offline.
      # Check 12 reads sw.js and asserts the shape its caching depends on: a
      # response handed to cache.put() must be a clone taken before respondWith()
      # claims the body, and the engine payload -- which arrives by fetch(), with
      # an empty destination -- must be routed rather than precached at install.
      # Both defects were real and both were invisible to every other check, so
      # this step re-introduces them and requires the guard to name each one.
      - name: Prove the worker-cache checks are not vacuous (mutation test)
        run: node scripts/sw-cache.negctl.mjs --static-only
      # The install payload is what every first-time visitor downloads before the
      # editor works offline, and it is paid atomically: install() runs
      # cache.addAll(), which aborts the whole install if one member fails. Check
      # 5 sums the byte size of every URL shellUrls() names and holds it to
      # scripts/precache-budget.json, which exists because the list was 738.1 KiB
      # of which 735.9 KiB was two images. This step breaks that budget two ways
      # -- an oversized file and a re-declared one -- and requires the guard to
      # say so. site/ is a committed build product, so a rebuild restores both.
      - name: Prove the install-budget check is not vacuous (mutation test)
        run: node scripts/precache-budget.negctl.mjs --static-only
      # The constant sw.js opens its cache under is injected by upstream's build
      # from a digest of the emitted asset graph, and that injection is the only
      # mechanism that retires a stale shell. This repository hand-patches the
      # artifact while keeping every filename, so nothing derives the constant
      # any more: site/ and sw.js could disagree and no step here would notice,
      # leaving every returning client on the copy it already has. Check 13
      # derives the token from the tree; this step breaks the agreement nine
      # ways and requires the guard to name each one.
      - name: Prove the shell-cache token check is not vacuous (mutation test)
        run: node scripts/shell-cache.negctl.mjs --static-only
      # The panel has always offered a process-corner selector; until this
      # repair the executor emitted no selector, the library had no corner
      # parameters, and all three choices returned the same devices. Check 14
      # (inside the artifact guard above) now ties the advertised corner list to
      # the selector the deck emits and to the library that answers it. This step
      # breaks that chain fifteen ways -- an emptied corner list, a dropped or
      # mis-mapped selector, a renamed .param, a stripped run record, an
      # unmodelled device -- and requires each to be named.
      - name: Prove the corner-selection check is not vacuous (mutation test)
        run: node scripts/corner-sweep.negctl.mjs
      # The File menu's Import SPICE control is a flat multi-file picker, while
      # the include resolver refuses anything that climbs above dirname(entry) --
      # which for a flat selection is empty. Check 15 (inside the artifact guard
      # above) ties the library text embedded in the chunk to site/models/, and
      # requires the pool to be CALLED rather than merely present: an earlier
      # draft of this repair added the definitions and forgot to rewire the call,
      # which every text search would have called a fix. This step mutates the
      # pool and the local-only guard and requires check 15 to name each.
      - name: Prove the import-reachability check is not vacuous (mutation test)
        run: node scripts/spice-import.negctl.mjs --static-only
      # The Gallery panel reads four endpoints at the origin ROOT while this app
      # is deployed under /spice-simulator/ and its worker is registered with
      # scope /spice-simulator/. The natural reading is "out of scope, so a
      # worker can never answer them" -- and that reading is wrong: scope decides
      # which clients a worker controls, not which of their requests it observes.
      # Check 16 (inside the artifact guard above) holds the injected route to its
      # contract. The case it exists for is a dispatch moved behind the /api/
      # early return, which leaves every string of a working shim present exactly
      # once and the four endpoints 404: a text search cannot see it, an ordered
      # assertion can. This step walks ten mutations -- two of them controls, one
      # the unpatched tree -- and requires each to be named for its own reason.
      - name: Prove the static-gallery check is not vacuous (mutation test)
        run: node scripts/gallery-shim.negctl.mjs --static-only
      # Check 17 (inside the artifact guard above) reads the example catalog and
      # each payload out of the shipped chunk and refuses the project factory's
      # placeholder identity. The rendered half -- that the title bar shows the
      # catalog name -- needs a browser, so it runs in the smoke job below; this
      # control covers the static half, where a payload keeping `project-main`
      # must be named even though the resolver would mask it at runtime.
      - name: Prove the example-identity check is not vacuous (mutation test)
        run: node scripts/example-identity.negctl.mjs --static-only
      - name: Publish site/ to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true

  # Runtime smoke test. The artifact guard above proves the bundle's references
  # and shell are coherent, but it cannot see runtime behavior: a build can pass
  # every static check and still throw on first interaction (the A7 defect --
  # 31 JSX call sites compiled to (void 0)( -- shipped a site that loaded fine
  # on the home page yet crashed the whole editor when "Run" was pressed, and the
  # guard stayed green). This job loads the page in headless Chrome, opens an
  # example, runs the simulation, and fails the build if it does not finish with
  # zero uncaught errors. It is the automated form of the A7 browser check.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: browser-actions/setup-chrome@v2
        id: chrome
      - name: Runtime smoke test
        run: node scripts/smoke-test.mjs --require
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
      # The smoke test runs with working storage. This one loads the same pages
      # in a browser where reading localStorage/sessionStorage throws -- Safari
      # private mode, blocked site data, a partitioned iframe -- and requires the
      # editor to render anyway. On 2026-09-20 six unguarded reads in React
      # initializers turned that environment into the error boundary's crash
      # screen: 42 elements, no SVG, no UI, on the home page and on every
      # ?example= deep link. Static check 10 covers the shape; this covers the
      # behaviour, and the two fail independently.
      - name: Storage-denied resilience
        run: node scripts/storage-resilience.mjs --require
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
      # A policy is worth shipping only if it is enforced AND does not break the
      # application, and both are behavioural. This loads the deployed shell
      # under its own policy, opens an example and runs a simulation, and
      # requires zero Content-Security-Policy violations -- asserting first that
      # the violation collector works, so a clean run cannot be a blind one.
      - name: Content-Security-Policy conformance
        run: node scripts/csp-conformance.mjs --require
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
      # And the other direction: the same harness, with an inline script that has
      # no matching hash and a script from an origin the policy does not name,
      # must SEE both violations and confirm the injected code never ran. Without
      # this, "zero violations" could just mean the collector is deaf.
      - name: Prove the policy is enforced, not decorative
        run: node scripts/csp-conformance.mjs --self-test --require
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
      # Every step above serves the artifact with "Cache-Control: no-store", which
      # the worker deliberately refuses to cache -- so none of them has ever
      # exercised the worker's caching, and that is exactly where the bugs were:
      # every put on the runtime route threw "Response body is already used", so
      # the cache held only install()'s six shell entries, and the 6.88 MB engine
      # was never routed there at all. Offline simulation worked only while the
      # browser's HTTP cache happened to hold a fresh 7 MB body.
      #
      # This step serves the artifact the way the deploy does (public, max-age),
      # then turns the network off AND disables the HTTP cache on the page and on
      # the worker, and requires a simulation to finish. Under those conditions
      # Cache Storage is the only possible source.
      - name: Offline simulation
        run: node scripts/offline-sim.mjs --require
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
      # And prove that test is not vacuous: the same two defects must be named by
      # check 12 (static) and must kill the offline test (runtime).
      - name: Prove the offline test is not vacuous (mutation test)
        run: node scripts/sw-cache.negctl.mjs --require
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
      # Check 5 reads the files shellUrls() names. This reads the cache back out
      # of a running browser instead, so the number is the one users actually
      # pay -- and it compares every stored entry against its file on disk, which
      # is how a target that resolved to something else would surface.
      - name: Install payload, measured in the browser
        run: node scripts/precache-weight.mjs --require
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
      - name: Prove the install-budget check is not vacuous (mutation test)
        run: node scripts/precache-budget.negctl.mjs --require
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
      # The smoke test above only ever drives one example, and that example is
      # the one that runs. This walks every entry in the shipped catalog and
      # requires each to reach an outcome the catalog itself implies: a setup
      # whose profile the executor advertises must complete with plots; a setup
      # whose profile it does not must be marked "(unavailable)" before the run
      # and then refused with a structured problem, before any deck executes; an
      # example that declares no setups must offer nothing to run. One lab ships
      # in the third state and three in the last, so the run has to tell those
      # apart rather than assume every tile is a lab.
      - name: Every built-in example either runs or says why it cannot
        run: node scripts/example-outcomes.mjs --require
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
      # And prove that check is not vacuous. Six mutations: the pre-run warning
      # removed, the unavailable profile declared as available, the model card
      # the runnable lab includes deleted, the Run control made unaddressable, a
      # catalog entry pointing at a payload that does not exist, and the only
      # un-runnable lab taken out of the catalog so the sweep loses its negative
      # control. Each must turn the check red for its own reason.
      - name: Prove the example-outcome check is not vacuous (mutation test)
        run: node scripts/example-outcomes.negctl.mjs --require
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
      # And the runtime half of check 13. The static check proves the declared
      # constant describes the tree; only a browser can show that the cache the
      # worker actually opened is the one the tree derives. The two cases at the
      # ends pin down that neither channel contains the other: a narrowed
      # activate() prefix is visible to the static channel ALONE (that case
      # requires this channel to stay green), and install() opening a cache
      # outside the prefix leaves the static guard completely green -- the
      # constant and both declarations are untouched -- so only this channel can
      # report it.
      - name: Prove the shell-cache token check is not vacuous (mutation test)
        run: node scripts/shell-cache.negctl.mjs --require
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
      # Can a user get a netlist in at all, and what does the product say about
      # its .include lines? This drives the real Import SPICE label through the
      # real file chooser -- requiring Chrome to report the chooser event before
      # any file is handed over, so drivability is asserted rather than assumed --
      # and reads the outcome back off the page. Four spellings must import; a
      # library this build does not ship, and a non-local path naming one it
      # does, must still be refused. The static step above shares the repair with
      # this one and neither contains the other: an unwired pool is visible to
      # the static channel (the call is missing from the text) while this channel
      # would see it only as the old refusal returning.
      - name: A netlist can be imported, and its includes resolve
        run: node scripts/spice-import.mjs --require
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
      - name: Prove the import guard is not vacuous (mutation test)
        run: node scripts/spice-import.negctl.mjs --require
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
      # Is the Gallery panel usable on a static deploy? It reads four endpoints
      # that only a server answers; the route above makes the worker answer them
      # from files under gallery/. This drives the panel in a real browser on two
      # trees. On the committed tree the gallery must stay DARK -- the built-in
      # example card is what a student sees -- while the list endpoints stop being
      # 404s, because a shim that lit the panel up here would be replacing the
      # example list rather than adding to it. On a copy with a two-entry
      # gallery/ it must LIGHT: the controls appear, the cards render, the tag
      # facets carry the right counts, the preview image loads from its
      # revisioned URL, and clicking a card opens the circuit through
      # /api/gallery/<id> -- the half a list-only test misses. The fixture's
      # project payload is lifted out of the shipped chunk rather than written by
      # hand, so the schema under test is the product's.
      - name: The Gallery panel works on a static deploy
        run: node scripts/gallery-shim.mjs --require
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
      # And prove the two channels above are not vacuous. Renaming the list key
      # and moving only the preview path must each turn exactly the POPULATED tree
      # red and leave the shipped tree green -- a mutant that took both down could
      # not tell "this key broke" from "the shim broke outright". Removing the
      # dispatch must turn both red. And the id guard's mutant declares itself
      # static-only, because no fixture supplies a hostile id: the browser is
      # required to be honest about the one rule it does not cover rather than
      # implying coverage it does not have.
      - name: Prove the static-gallery check is not vacuous (mutation test)
        run: node scripts/gallery-shim.negctl.mjs --require
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
      # The example-identity half a browser is needed for: the title bar must
      # show the name the user picked in the catalog, not whatever the payload
      # stored. Three mutations are walked -- a payload reverted to the
      # placeholder, the resolver reverted to handing the stored name through,
      # and every payload renamed to the SAME wrong string (which a
      # "differs from the catalog" rule would pass and this one must not).
      - name: Prove the example-identity check is not vacuous (browser mutation test)
        run: node scripts/example-identity.negctl.mjs --require
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
