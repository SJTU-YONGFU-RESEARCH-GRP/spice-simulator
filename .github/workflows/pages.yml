name: Deploy GitHub Pages

# Deploys the Vite schematic editor build from ./site (not the legacy MNA UI).
# Refresh ./site with: ./scripts/publish-editor-pages.sh

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify editor site bundle
        run: test -f site/index.html && test -d site/assets
      - name: Publish site/ to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
